# Use H2 in-memory database for testing
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.username=sa
quarkus.datasource.password=

# Hibernate settings for testing
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file

# JWT validation configuration for testing
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=com.bank
smallrye.jwt.sign.key.location=privateKey.pem
quarkus.http.auth.proactive=false

# Scheduler disabled during tests
quarkus.scheduler.enabled=false

# Arc CDI Configuration
quarkus.arc.exclude-types=*Test,*Test$*,*Tests,*Tests$*
